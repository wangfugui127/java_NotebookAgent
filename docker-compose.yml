name: java-notebookagent

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file:
    - path: .env.example
    - path: .env
      required: false
  environment:
    QUEUE_KEY_PREFIX: java-notebookagent
    UPLOAD_DIR: /data/uploads
    MYSQL_HOST: mysql
    MYSQL_PORT: 3306
    REDIS_URL: redis://redis:6379/0
    MILVUS_URI: http://milvus:19530
    NEO4J_URI: bolt://neo4j:7687
    MCP_SERVERS_CONFIG: /app/config/mcp_servers.yaml
    MCP_EXPOSE_CONFIG: /app/config/mcp_expose.yaml
    SKILLS_CONFIG: /app/config/skills.yaml
    EVAL_GOLDEN_PATH: /app/config/eval_golden.json
  volumes:
    - java-uploads:/data/uploads
    - ./config:/app/config:ro
    - ./skills:/app/skills:ro
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    milvus:
      condition: service_healthy
  restart: unless-stopped
  profiles: [core]

services:
  mysql:
    image: mysql:8.4
    profiles: [core]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-notebookagent}
      MYSQL_USER: ${MYSQL_USER:-notebookagent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-notebookagent}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports: ["13317:3306"]
    volumes: [java-mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    profiles: [core]
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:16381:6379"]
    volumes: [java-redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    profiles: [core]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    volumes: [java-etcd-data:/etcd]
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2024-05-28T17-19-04Z
    profiles: [core]
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address :9001
    volumes: [java-minio-data:/minio_data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.6.4
    profiles: [core]
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports: ["19531:19530"]
    volumes: [java-milvus-data:/var/lib/milvus]
    depends_on:
      etcd: { condition: service_started }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    profiles: [graph]
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-notebookagent-neo4j}
      NEO4J_server_memory_heap_initial__size: 384m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 512m
    ports: ["17474:7474", "17687:7687"]
    volumes: [java-neo4j-data:/data]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-notebookagent-neo4j} 'RETURN 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  api:
    <<: *backend
    ports: ["18001:8001"]

  worker:
    <<: *backend
    command: ["--spring.profiles.active=worker"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    profiles: [core]
    ports: ["13000:80"]
    depends_on:
      api: { condition: service_started }
    restart: unless-stopped

volumes:
  java-mysql-data:
  java-redis-data:
  java-etcd-data:
  java-minio-data:
  java-milvus-data:
  java-neo4j-data:
  java-uploads:
